<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
<!-- A made-up stretch of coast drawn in the app's Quiet map theme (android/car/assets/maptheme/quiet.xml): charcoal
     land, dark slate water, roads in greys ranked by width and brightness, and the route and the convoy's cars on top
     in the accent and gold. The site inlines it (without this style block) and colours it by the page's theme. -->
<style>
.land { fill: #22272f } .sea { fill: #101a27 } .river { fill: none; stroke: #101a27; stroke-width: 9; stroke-linecap: round }
.park { fill: #252c2f } .bld { fill: #272c34 }
.r { fill: none; stroke-linecap: round; stroke-linejoin: round }
.r1 { stroke: #9aa1ab; stroke-width: 11 } .r2 { stroke: #7b828c; stroke-width: 8 } .r3 { stroke: #5a616b; stroke-width: 5 }
.r4 { stroke: #474e58; stroke-width: 3 }
.casing { fill: none; stroke: #12161b; stroke-width: 17; stroke-linecap: round; stroke-linejoin: round }
.route { fill: none; stroke: #2f7bff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round }
.route-glow { fill: none; stroke: #2f7bff; stroke-opacity: .28; stroke-width: 22; stroke-linecap: round; stroke-linejoin: round }
.car { fill: #2f7bff; stroke: #e8eef7; stroke-width: 3; stroke-linejoin: round } .car.other { fill: #e3b341 }
.pin { fill: #e3b341; stroke: #12161b; stroke-width: 3 }
</style>
